# Configuración común. Sin secretos: los datos de MySQL van en application-local.properties (no se sube a git).
spring.application.name=pachangueo

# --- Base de datos ---
# Flyway crea y cambia el esquema (src/main/resources/db/migration/Vn__*.sql).
# Hibernate solo comprueba que las tablas coinciden con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# --- Sesión ---
# Cookie de sesión HttpOnly (JavaScript no puede leerla), Secure y SameSite=Lax.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30d

# --- Errores ---
# Los mensajes los pone ManejadorErrores en español; no se enseñan trazas ni detalles internos.
server.error.include-stacktrace=never
server.error.include-message=never
