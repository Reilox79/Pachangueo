# Perfil de los tests: se suma a application.properties y solo cambia la base de datos
# por H2 en memoria en modo MySQL, para no depender del servidor.
spring.datasource.url=jdbc:h2:mem:pachangueo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
